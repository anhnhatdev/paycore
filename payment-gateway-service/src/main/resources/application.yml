server:
  port: ${PORT:8084}

spring:
  application:
    name: payment-gateway-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/payment_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: PaymentGatewayHikariPool
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        show_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.uuid}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

# Provider Sandbox Configurations
payment:
  gateway:
    reconcile:
      stuck-threshold-seconds: ${PAYMENT_RECONCILE_STUCK_THRESHOLD_SECONDS:300}
      cron: ${PAYMENT_RECONCILE_CRON:0 */5 * * * *}
    outbox:
      batch-size: 50
      cron: ${PAYMENT_OUTBOX_CRON:*/5 * * * * *}
      topic: ${PAYMENT_GATEWAY_TOPIC:paycore.gateway-events}
    vnpay:
      tmn-code: ${VNPAY_TMN_CODE:PAYCORE01}
      hash-secret: ${VNPAY_HASH_SECRET:VNPAYSECRETKEY2026PAYCORE123456}
      url: ${VNPAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      return-url: ${VNPAY_RETURN_URL:http://localhost:8080/webhooks/vnpay/callback}
      version: "2.1.0"
      command: "pay"
    momo:
      partner-code: ${MOMO_PARTNER_CODE:MOMO_PAYCORE}
      access-key: ${MOMO_ACCESS_KEY:MOMO_ACCESS_KEY_2026}
      secret-key: ${MOMO_SECRET_KEY:MOMO_SECRET_KEY_2026}
      endpoint: ${MOMO_ENDPOINT:https://test-payment.momo.vn/v2/gateway/api/create}
      return-url: ${MOMO_RETURN_URL:http://localhost:8080/webhooks/momo/callback}
      notify-url: ${MOMO_NOTIFY_URL:http://localhost:8080/webhooks/momo}
    stripe:
      api-key: ${STRIPE_API_KEY:sk_test_paycore_stripe_mock_key_2026}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_paycore_stripe_secret_2026}
