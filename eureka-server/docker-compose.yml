version: '3.9'

services:
  eureka-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: paycore-eureka-server
    restart: unless-stopped
    ports:
      - "8761:8761"
    environment:
      SERVER_PORT: 8761
      EUREKA_HOST: eureka-server
      EUREKA_SELF_PRESERVATION: "false"
      EUREKA_EVICTION_INTERVAL_MS: 5000
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8761/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
