server:
  port: 0

spring:
  application:
    name: audit-service
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
  datasource:
    url: jdbc:h2:mem:audit_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;TIME ZONE=UTC
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
    hikari:
      pool-name: AuditTestHikariPool
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

feign:
  circuitbreaker:
    enabled: false

paycore:
  audit:
    checkpoint:
      cron: "-"
    archival:
      retention-months: 12
