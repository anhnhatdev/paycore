server:
  port: 8088

spring:
  application:
    name: audit-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5440/audit_db}
    username: ${SPRING_DATASOURCE_USERNAME:paycore_user}
    password: ${SPRING_DATASOURCE_PASSWORD:paycore_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: paycore-audit-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.value}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

paycore:
  kafka:
    topics:
      transaction-events: ${KAFKA_TOPIC_TRANSACTIONS:paycore.transaction-events}
      gateway-events: ${KAFKA_TOPIC_GATEWAY:paycore.gateway-events}
      account-events: ${KAFKA_TOPIC_ACCOUNT:paycore.account-events}
      fraud-events: ${KAFKA_TOPIC_FRAUD:paycore.fraud-events}
  audit:
    checkpoint:
      cron: ${CHECKPOINT_CRON:0 0 23 * * *}
    archival:
      retention-months: ${RETENTION_MONTHS:12}
