server:
  port: 0

spring:
  application:
    name: notification-service
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
  datasource:
    url: jdbc:h2:mem:notification_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
    hikari:
      pool-name: NotificationTestHikariPool
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

feign:
  circuitbreaker:
    enabled: false

notification:
  dead-letter-topic: paycore.notification.dead-letter
  account-service-url: http://localhost:8081
  retry:
    max-attempts: 3
    interval-ms: 9999999
  pending-recovery:
    stuck-threshold-minutes: 5
    interval-ms: 9999999
