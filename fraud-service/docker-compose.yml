version: '3.8'

services:
  fraud-db:
    image: postgres:16-alpine
    container_name: paycore-fraud-db
    environment:
      POSTGRES_DB: fraud_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5437:5432"
    volumes:
      - fraud_db_data:/var/lib/postgresql/data

  fraud-redis:
    image: redis:7-alpine
    container_name: paycore-fraud-redis
    ports:
      - "6380:6379"

volumes:
  fraud_db_data:
